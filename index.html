<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Bangers&display=swap" rel="stylesheet">
<title>家計簿</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #131313;
    --panel2: #1e1e1e;
    --red: #e60023;
    --red2: #ff1f3d;
    --white: #f5f2ee;
    --gray: #8a8a8a;
    --cyan: #2ee6d6;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:var(--bg); color:var(--white);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-size:15px; line-height:1.45; overflow-x:hidden;
  }
  button { font-family:inherit; }
  .p5f { font-family:'Reggae One', "Hiragino Sans", sans-serif; font-weight:400; }
  .num { font-family:'Reggae One', sans-serif; font-variant-numeric:tabular-nums; font-style:italic; font-weight:400; letter-spacing:.01em; }
  .en { font-family:'Bangers', 'Reggae One', cursive; letter-spacing:.25em; font-style:normal; font-weight:400; }
  button, input, select, .chip, .tappable { touch-action:manipulation; }

  .app { max-width:480px; margin:0 auto; min-height:100dvh;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:calc(100px + env(safe-area-inset-bottom, 0px)); position:relative; }
  .screen { display:none; position:relative; z-index:1; padding:14px 14px 30px; }
  .screen.active { display:block; }

  /* ===== 背景コラージュ ===== */
  .bg-deco { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .bg-deco .dots { position:absolute; inset:0;
    background-image:radial-gradient(circle, rgba(255,255,255,.05) 1.2px, transparent 1.3px);
    background-size:9px 9px; }
  .bg-star { position:absolute; background:#151515;
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); }

  /* ===== 見出し(切り抜きコラージュ文字) ===== */
  .ransom { font-weight:400; display:flex; align-items:baseline; gap:4px; }
  .ransom span { display:inline-block; font-style:italic; font-family:'Reggae One', sans-serif; }
  .ransom span:nth-child(odd)  { transform:rotate(-4deg) translateY(-1px); }
  .ransom span:nth-child(even) { transform:rotate(3deg) translateY(2px); }
  .ransom span:nth-child(3n)   { background:var(--white); color:#000; padding:0 4px; }
  .ransom span:nth-child(4n+1) { background:#000; color:var(--white); padding:0 4px; box-shadow:0 0 0 2px var(--white); }
  .ransom span:nth-child(5n)   { color:var(--red2); }
  .sec-head { display:flex; align-items:center; gap:10px; margin:22px 4px 12px; }
  .sec-head .ransom { font-size:17px; }
  .sec-head .en { font-size:10px; color:var(--gray); }
  .sec-head::after { content:""; flex:1; height:3px; background:repeating-linear-gradient(-60deg, var(--white) 0 8px, transparent 8px 16px); opacity:.35; }

  /* ===== ホーム ===== */
  .date-head { display:flex; align-items:baseline; gap:10px; margin:4px 4px 14px; flex-wrap:wrap; }
  .date-head .d { font-size:32px; font-family:'Reggae One', sans-serif; font-style:italic; letter-spacing:-.02em; }
  .date-head .wd { font-size:15px; font-family:'Bangers', cursive; letter-spacing:.15em; color:var(--cyan); }
  .date-head .wd.sun { color:var(--red2); }
  .date-head .today-tag { background:var(--white); color:#000; font-size:10px; font-family:'Reggae One', sans-serif; padding:2px 8px; transform:rotate(-4deg); box-shadow:3px 3px 0 var(--red); }
  .date-head .spent { margin-left:auto; text-align:right; font-size:10px; color:var(--gray); font-weight:800; }
  .date-head .spent b { display:block; font-size:16px; color:var(--white); }

  .budget-panel { position:relative; background:var(--red);
    clip-path:polygon(0 0, 100% 0, 100% 86%, 92% 100%, 0 100%);
    padding:18px 18px 20px; margin-bottom:16px; box-shadow:6px 6px 0 #000;
    animation:slam .4s .05s cubic-bezier(.2,1.4,.4,1) both; }
  .budget-panel::before { content:""; position:absolute; inset:0; background:#0d0d0d;
    clip-path:polygon(0 58%, 100% 22%, 100% 100%, 0 100%); }
  .budget-panel::after { content:""; position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(circle, rgba(0,0,0,.18) 1.5px, transparent 1.6px); background-size:7px 7px;
    clip-path:polygon(0 0, 100% 0, 100% 22%, 0 58%); }
  .budget-panel .t { position:relative; z-index:1; font-size:11px; font-weight:900; color:#fff; }
  .budget-panel .t .en { font-size:9px; opacity:.85; margin-left:8px; }
  .budget-panel .v { position:relative; z-index:1; font-size:48px; color:var(--white); margin-top:12px; line-height:1; text-shadow:4px 4px 0 #000; }
  .budget-panel .v.over { color:var(--red2); }
  .budget-panel .v .yen { color:var(--red2); font-size:30px; margin-right:2px; display:inline-block; transform:skew(-14deg); text-shadow:3px 3px 0 #000; }
  .budget-panel .sub { position:relative; z-index:1; font-size:10px; color:var(--gray); font-weight:800; margin-top:8px; }
  .usedtag { display:inline-block; background:var(--white); color:#000; font-size:10px; font-family:'Reggae One', sans-serif; font-style:italic; padding:1px 7px; transform:rotate(-3deg); box-shadow:2px 2px 0 var(--red2); margin-right:6px; }
  .gauge { position:relative; z-index:1; height:13px; margin-top:10px; background:#000;
    clip-path:polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
  .gauge .fill { height:100%; background:repeating-linear-gradient(-60deg, var(--red2) 0 10px, #b3001b 10px 20px); max-width:100%; }

  .due { position:relative; background:var(--red); color:#fff; transform:rotate(-1.6deg);
    padding:13px 16px; margin:4px 4px 18px;
    clip-path:polygon(1% 4%, 99% 0, 100% 92%, 97% 100%, 0 98%);
    box-shadow:5px 6px 0 #000, 6px 7px 0 rgba(255,255,255,.2);
    animation:slamRot .4s .12s cubic-bezier(.2,1.4,.4,1) both; }
  .due .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .due .t { font-size:12px; font-weight:900; }
  .due .days { background:#000; color:var(--white); font-size:10px; font-family:'Reggae One', sans-serif; padding:3px 10px; transform:skew(-10deg); flex-shrink:0; }
  .due .days.late { color:var(--red2); }
  .due .v { font-size:28px; margin:4px 0 2px; text-shadow:3px 3px 0 rgba(0,0,0,.5); }
  .due .ok { font-size:11px; font-family:'Reggae One', sans-serif; background:#fff; color:#000; display:inline-block; padding:2px 8px; transform:rotate(-1deg); }
  .due .ok.ng { background:#000; color:var(--red2); box-shadow:0 0 0 2px #fff; }
  .due .next { font-size:10px; opacity:.9; font-weight:800; margin-top:6px; border-top:2px dashed rgba(255,255,255,.4); padding-top:5px; }

  .quick { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:0 2px 6px; }
  .qbtn { position:relative; background:var(--white); color:#000; border:none; cursor:pointer;
    font-family:'Reggae One', sans-serif; font-size:12px; padding:13px 2px 9px;
    clip-path:polygon(4% 8%, 96% 0, 100% 88%, 92% 100%, 2% 96%);
    box-shadow:4px 4px 0 var(--red); transition:transform .12s; animation:pop .3s both; }
  .qbtn:nth-child(1){ transform:rotate(-3deg); animation-delay:.18s }
  .qbtn:nth-child(2){ transform:rotate(2deg);  animation-delay:.22s }
  .qbtn:nth-child(3){ transform:rotate(-2deg); animation-delay:.26s }
  .qbtn:nth-child(4){ transform:rotate(3deg);  animation-delay:.3s }
  .qbtn:active { transform:scale(1.08); }
  .qbtn .e { display:block; font-size:18px; }
  .qbtn.dark { background:#000; color:var(--white); box-shadow:4px 4px 0 var(--red), 0 0 0 2px var(--white) inset; }

  .asset-bar { display:flex; align-items:center; justify-content:space-between;
    background:#000; border:3px solid var(--white); transform:skew(-6deg);
    padding:9px 16px; margin:16px 6px 4px; box-shadow:5px 5px 0 var(--red);
    animation:slideinSkew .35s .2s both; }
  .asset-bar > * { transform:skew(6deg); }
  .asset-bar .t { font-size:12px; font-weight:900; letter-spacing:.1em; }
  .asset-bar .t .en { font-size:9px; color:var(--gray); display:block; letter-spacing:.25em; }
  .asset-bar .v { font-size:23px; }
  .asset-bar .v .yen { color:var(--red2); display:inline-block; transform:skew(-12deg); }

  /* 口座残高(名札パネル) */
  .accs { margin:0 2px; }
  .acc { position:relative; display:flex; align-items:center; gap:10px;
    background:var(--panel); margin-bottom:8px; padding:9px 14px 9px 12px;
    clip-path:polygon(0 14%, 2.5% 0, 55% 3%, 98% 0, 100% 80%, 97.5% 100%, 40% 96%, 1% 100%);
    border-left:5px solid var(--white); animation:slidein .3s both; }
  .acc:nth-child(even){ transform:rotate(.4deg); }
  .acc.arch { opacity:.55; }
  .acc .sil { width:30px; height:30px; background:var(--white); font-size:14px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    clip-path:polygon(10% 12%, 90% 4%, 96% 88%, 6% 96%); }
  .acc .an { flex:1; font-size:13px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-family:'Reggae One', "Hiragino Sans", sans-serif; }
  .acc .an .tag { font-size:9px; background:var(--red); color:#fff; padding:1px 6px; margin-left:7px; display:inline-block; transform:skew(-10deg); }
  .acc .av { font-size:17px; flex-shrink:0; }
  .acc.credit { border-left-color:var(--red); }
  .acc.credit .av { color:var(--red2); }

  /* 記録リスト */
  .tx { position:relative; display:flex; align-items:center; gap:12px;
    background:var(--panel); margin-bottom:9px; padding:10px 14px 10px 16px;
    clip-path:polygon(0 0, 100% 3%, 99% 100%, 1% 97%);
    border-left:6px solid var(--red); animation:slidein .3s both; }
  .tx.tappable { cursor:pointer; }
  .tx.tappable:active { background:var(--panel2); }
  .tx .sil { width:34px; height:34px; background:var(--white); color:#000; font-size:16px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    clip-path:polygon(8% 12%, 92% 4%, 96% 90%, 6% 96%); }
  .tx .body { flex:1; min-width:0; }
  .tx .n { font-weight:900; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx .s { font-size:10px; color:var(--gray); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx .a { font-size:16px; flex-shrink:0; }
  .a.exp { color:var(--red2); } .a.inc { color:var(--cyan); } .a.trf { color:var(--white); opacity:.85; }
  .date-head2 { font-size:13px; font-family:'Reggae One', sans-serif; color:var(--gray); margin:16px 6px 8px; }
  .date-head2 b { color:var(--white); font-size:15px; }
  .empty { text-align:center; color:var(--gray); font-size:12px; font-weight:700; padding:24px 0; }

  /* ===== 月ナビ ===== */
  .month { display:flex; align-items:center; justify-content:space-between; margin:2px 2px 16px; }
  .month .m { font-size:26px; font-family:'Reggae One', sans-serif; font-style:italic; }
  .month .m small { font-size:13px; color:var(--gray); }
  .month button { background:var(--white); color:#000; border:none; width:38px; height:38px; font-weight:900; font-size:16px;
    cursor:pointer; clip-path:polygon(10% 0, 100% 8%, 92% 100%, 0 92%); box-shadow:3px 3px 0 var(--red); }
  .page-title { text-align:center; padding:4px 0 14px; }
  .page-title .ransom { justify-content:center; font-size:20px; }

  /* ===== クイック入力 ===== */
  .amt-zone { text-align:center; padding:8px 0 2px; animation:slam .3s both; }
  .amt-zone .v { font-size:58px; line-height:1.1; text-shadow:5px 5px 0 var(--red), 7px 7px 0 #000; word-break:break-all; }
  .amt-zone .v .yen { color:var(--red2); font-size:34px; display:inline-block; transform:skew(-14deg); text-shadow:4px 4px 0 #000; }
  .amt-zone .cat { display:inline-block; margin-top:8px; background:var(--white); color:#000; font-size:10px; font-family:'Reggae One', sans-serif; padding:3px 12px; transform:rotate(-2deg); box-shadow:3px 3px 0 var(--red); }
  .chips { display:flex; flex-wrap:wrap; gap:9px; margin:14px 2px; }
  .chip { background:#000; color:var(--white); border:2px solid var(--white); font-family:'Reggae One', sans-serif; font-size:12px;
    padding:8px 13px; cursor:pointer; transform:skew(-8deg); transition:all .1s; }
  .chip:nth-child(even){ transform:skew(-8deg) rotate(1.5deg); }
  .chip.sel { background:var(--red); border-color:var(--red); color:#fff; box-shadow:3px 3px 0 #000, 0 0 0 2px var(--white); transform:skew(-8deg) scale(1.06); }
  .chip span { display:inline-block; transform:skew(8deg); }
  .paylist { margin:0 2px 14px; }
  .payrow { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 14px; margin-bottom:6px;
    font-family:'Reggae One', sans-serif; font-size:13px; cursor:pointer; color:var(--gray);
    clip-path:polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); background:var(--panel); }
  .payrow .pn { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .payrow.sel { background:var(--red); color:#fff; box-shadow:0 0 0 2px var(--white) inset; animation:selpulse 1.4s infinite; }
  .payrow.sel .pn::before { content:"★ "; }
  .payrow .bal { font-size:11px; font-style:italic; flex-shrink:0; }
  .charge-route { display:flex; align-items:center; justify-content:center; gap:10px; background:var(--panel); padding:12px; margin:0 2px 14px;
    clip-path:polygon(0 10%, 100% 0, 99% 90%, 1% 100%); font-family:'Reggae One', sans-serif; font-size:14px; }
  .charge-route .arr { color:var(--red2); font-size:18px; }
  .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:0 2px 14px; }
  .key { background:#000; border:3px solid var(--white); color:var(--white); font-size:21px; font-family:'Reggae One', sans-serif; font-style:italic;
    padding:12px 0; cursor:pointer; transform:skew(-4deg); transition:all .08s; }
  .key:nth-child(even) { transform:skew(-4deg) rotate(.8deg); }
  .key:active { background:var(--red); box-shadow:3px 3px 0 #000; }
  .key.fn { color:var(--red2); }
  .save-btn { display:block; width:96%; margin:0 auto; background:var(--red); color:#fff; border:none; cursor:pointer;
    font-family:'Reggae One', sans-serif; font-size:17px; letter-spacing:.2em; padding:14px;
    clip-path:polygon(2% 12%, 98% 0, 100% 84%, 96% 100%, 0 96%);
    box-shadow:5px 5px 0 #000, 6px 6px 0 rgba(255,255,255,.25); transition:transform .1s; }
  .save-btn:active { transform:scale(1.03) rotate(-.5deg); }
  .save-btn .en { font-size:9px; display:block; opacity:.85; }
  .hint { font-size:10px; color:var(--gray); font-weight:700; margin:10px 6px 0; }
  .link-btn { background:none; border:none; color:var(--cyan); font-size:12px; font-weight:900; cursor:pointer; text-decoration:underline; }

  /* ===== 詳細入力フォーム ===== */
  .seg { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:0 2px 16px; }
  .seg button { border:2px solid var(--white); background:#000; color:var(--gray); padding:10px 0; font-family:'Reggae One', sans-serif; font-size:14px; cursor:pointer; transform:skew(-6deg); }
  .seg button.on-exp, .seg button.on-inc, .seg button.on-trf { background:var(--red); color:#fff; border-color:var(--red); box-shadow:3px 3px 0 #000, 0 0 0 2px var(--white); }
  .seg button.on-inc { background:#0b8f84; border-color:#0b8f84; }
  .seg button.on-trf { background:#333; border-color:#333; }
  .fld { margin:0 2px 16px; }
  .fld label { display:block; font-size:11px; font-family:'Reggae One', sans-serif; color:var(--gray); margin:0 4px 6px; }
  .fld input, .fld select {
    width:100%; background:var(--panel); border:2px solid var(--white); color:var(--white);
    padding:11px 14px; font-size:16px; outline:none; appearance:none; border-radius:0;
    clip-path:polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
  .fld input:focus, .fld select:focus { border-color:var(--red2); }
  .pay { display:flex; align-items:center; gap:10px; background:var(--panel); padding:7px 8px 7px 12px; margin-bottom:8px;
    clip-path:polygon(0 6%, 100% 0, 99.5% 94%, .5% 100%); border-left:4px solid var(--white); }
  .pay .em { font-size:15px; }
  .pay .n { flex:1; font-size:13px; font-family:'Reggae One', sans-serif; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pay input { width:120px; background:#000; border:2px solid var(--gray); color:var(--white); padding:8px 10px; font-size:16px; text-align:right; outline:none; flex-shrink:0; border-radius:0; }
  .pay input:focus { border-color:var(--red2); }
  .g-title { font-size:10px; font-family:'Reggae One', sans-serif; color:var(--gray); margin:12px 6px 6px; letter-spacing:.15em; }
  .btn-danger { display:block; width:96%; margin:12px auto 0; background:#000; color:var(--red2); border:2px solid var(--red); cursor:pointer;
    font-family:'Reggae One', sans-serif; font-size:13px; padding:11px; transform:skew(-4deg); }

  /* ===== 分析 ===== */
  .kpi2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:6px; }
  .kpi { background:var(--panel); padding:12px 14px; clip-path:polygon(0 6%, 100% 0, 98% 100%, 2% 96%);
    border-left:5px solid var(--red); animation:slam .35s both; }
  .kpi:nth-child(2){ animation-delay:.08s; border-left-color:var(--cyan); }
  .kpi .t { font-size:10px; color:var(--gray); }
  .kpi .v { font-size:21px; margin-top:2px; }
  .kpi .d { font-size:9px; color:var(--gray); font-weight:800; }
  .panel { background:var(--panel); padding:16px 14px; margin-bottom:14px;
    clip-path:polygon(0 1%, 100% 0, 99.5% 99%, .5% 100%);
    border-top:4px solid var(--red); animation:slidein .35s .08s both; }
  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar-row .lb { width:82px; font-size:11px; font-weight:900; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-row .track { flex:1; }
  .bar-row .fill { height:13px; background:var(--red);
    clip-path:polygon(0 0, 100% 0, calc(100% - 6px) 100%, 0 100%); min-width:3px; }
  .bar-row .val { width:62px; text-align:right; font-size:11px; flex-shrink:0; }
  .budget-line { margin-bottom:14px; }
  .budget-line .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:12px; font-weight:900; margin-bottom:5px; }
  .budget-line .top .warn { color:var(--red2); background:#fff; padding:0 6px; transform:rotate(-2deg); display:inline-block; font-size:10px; font-family:'Reggae One', sans-serif; }
  .budget-line .top .ok { color:var(--cyan); font-size:10px; }
  .budget-line .top .r { font-size:10px; color:var(--gray); }
  .btrack { height:12px; background:#000; border:2px solid var(--white); clip-path:polygon(0 0, 100% 0, calc(100% - 7px) 100%, 0 100%); }
  .bfill { height:100%; max-width:100%; }
  .bf-warn { background:repeating-linear-gradient(-60deg, var(--red2) 0 8px, #a30018 8px 16px); }
  .bf-ok { background:var(--cyan); }

  /* ===== 設定 ===== */
  .set-list { background:var(--panel); margin:0 2px 10px; clip-path:polygon(0 .6%, 100% 0, 99.6% 99.4%, .4% 100%); border-top:4px solid var(--red); }
  .set-item { display:flex; align-items:center; gap:9px; padding:11px 13px; border-bottom:1px solid #262626; }
  .set-item:last-child { border-bottom:none; }
  .set-item .grow { flex:1; min-width:0; }
  .set-item .nm { font-family:'Reggae One', sans-serif; font-size:13px; }
  .set-item .meta { color:var(--gray); font-size:10px; font-weight:700; }
  .badge { font-size:10px; font-family:'Reggae One', sans-serif; padding:2px 8px; transform:skew(-8deg); flex-shrink:0; }
  .badge.exp { background:var(--red); color:#fff; }
  .badge.inc { background:#0b8f84; color:#fff; }
  .badge.off { background:var(--white); color:#000; }
  .icon-btn { background:#000; border:2px solid var(--white); color:var(--white); width:35px; height:35px; font-size:13px; cursor:pointer; flex-shrink:0; transform:skew(-4deg); }

    font-family:'Reggae One', sans-serif; font-size:13px; padding:12px 14px; cursor:pointer; transform:skew(-3deg); }

  .ver { text-align:center; color:var(--gray); font-size:10px; font-weight:700; padding:18px 0 6px; }

  .modal input, .modal select { width:100%; background:#000; border:2px solid var(--white); color:var(--white); padding:10px 12px; font-size:15px; outline:none; appearance:none; border-radius:0; }
  .modal input:focus, .modal select:focus { border-color:var(--red2); }
  .modal .btns { display:flex; gap:10px; margin-top:16px; }
  .modal .btns button { flex:1; padding:11px; border:none; font-family:'Reggae One', sans-serif; font-size:14px; cursor:pointer; transform:skew(-6deg); }
  .modal .btns .cancel { background:#000; color:var(--gray); border:2px solid var(--gray); }
  .modal .btns .ok { background:var(--red); color:#fff; box-shadow:3px 3px 0 #000; }
  .modal .btns .ok.danger { background:#000; color:var(--red2); border:2px solid var(--red); }

  /* ===== タブバー ===== */
  .tabbar { position:fixed; bottom:0; left:0; right:0; z-index:20; padding-bottom:env(safe-area-inset-bottom, 0px); background:#000; border-top:4px solid var(--red); }
  .tabbar .inner { max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); height:60px; align-items:stretch; }
  .tab { position:relative; background:none; border:none; color:var(--gray); font-family:'Reggae One', sans-serif; font-size:10px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; z-index:1; }
  .tab .e { font-size:16px; }
  .tab.active { color:#fff; }
  .tab.active::before { content:""; position:absolute; inset:5px 3px; background:var(--red); transform:skew(-10deg); z-index:-1; box-shadow:3px 3px 0 rgba(255,255,255,.2); }
  .tab.add .e { width:42px; height:42px; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:22px; margin-top:-22px;
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    transform:scale(1.7); }

  /* ===== トースト ===== */
  #toast { position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%) translateY(20px) skew(-6deg);
    background:var(--red); color:#fff; font-family:'Reggae One', sans-serif; font-size:13px;
    padding:9px 22px; opacity:0; pointer-events:none; transition:all .22s ease; z-index:100;
    box-shadow:4px 4px 0 #000, 5px 5px 0 rgba(255,255,255,.3); white-space:nowrap; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0) skew(-6deg); }

  /* ===== アニメーション ===== */
  @keyframes slam { from { opacity:0; transform:translateX(-40px) skew(-16deg) scale(1.1); } to { opacity:1; } }
  @keyframes slamRot { from { opacity:0; transform:translateX(-40px) rotate(-8deg) scale(1.1); } to { opacity:1; transform:translateX(0) rotate(-1.6deg) scale(1); } }
  @keyframes slidein { from { opacity:0; transform:translateX(-24px); } to { opacity:1; } }
  @keyframes slideinSkew { from { opacity:0; transform:translateX(-24px) skew(-6deg); } to { opacity:1; transform:translateX(0) skew(-6deg); } }
  @keyframes pop { from { opacity:0; transform:scale(0) rotate(15deg); } }
  @keyframes selpulse { 0%,100% { box-shadow:0 0 0 2px var(--white) inset; } 50% { box-shadow:0 0 0 3px var(--white) inset, 4px 4px 0 #000; } }

<script>
"use strict";
/* ================================================================
   家計簿アプリ v3.0 — ペルソナ5スタイル
   - localStorage("kakeibo-data") / schemaVersion 3
   - エクスポート / インポートで引き継ぎ
   ================================================================ */

const SEED_DATA = null; // 公開版: 個人データは含めない

const STORAGE_KEY = "kakeibo-data";
const APP_VERSION = "3.0";
const SCHEMA_VERSION = 3;

// SEED_DATA が null の場合(公開版)の初期データ
const DEFAULT_DATA = {
  schemaVersion: 3,
  settings: { monthlyBudget: 60000, categoryBudgets: {} },
  accounts: [
    { id:"cash",   name:"現金",           kind:"asset",  group:"現金",           initialBalance:0, sortOrder:1, archived:false },
    { id:"paypay", name:"PayPay",         kind:"asset",  group:"PayPay",         initialBalance:0, sortOrder:2, archived:false },
    { id:"bank1",  name:"銀行",           kind:"asset",  group:"銀行",           initialBalance:0, sortOrder:3, archived:false },
    { id:"card1",  name:"クレジットカード", kind:"credit", group:"クレジットカード", initialBalance:0, sortOrder:4, archived:false, closingDay:31, payDay:27, payFromId:null }
  ],
  categories: [
    { id:"food", name:"食費", type:"expense", sortOrder:1 }, { id:"daily", name:"日用品", type:"expense", sortOrder:2 },
    { id:"transport", name:"交通費", type:"expense", sortOrder:3 }, { id:"fun", name:"娯楽", type:"expense", sortOrder:4 },
    { id:"date", name:"デート・遊び", type:"expense", sortOrder:5 }, { id:"beauty", name:"美容室", type:"expense", sortOrder:6 },
    { id:"fashion", name:"衣服", type:"expense", sortOrder:7 }, { id:"social", name:"交際費", type:"expense", sortOrder:8 },
    { id:"health", name:"医療・健康", type:"expense", sortOrder:9 }, { id:"edu", name:"教育・資格", type:"expense", sortOrder:10 },
    { id:"subsc", name:"サブスク", type:"expense", sortOrder:11 }, { id:"invest", name:"投資・貯金", type:"expense", sortOrder:12 },
    { id:"other", name:"その他", type:"expense", sortOrder:13 }, { id:"salary", name:"給料", type:"income", sortOrder:14 },
    { id:"pocket", name:"お小遣い・もらい物", type:"income", sortOrder:15 }, { id:"misc_in", name:"その他収入", type:"income", sortOrder:16 },
    { id:"warikan", name:"割り勘", type:"income", offsetExpense:true, sortOrder:17 }
  ],
  transactions: []
};

/* ---------------- データ層 ---------------- */
function migrate(d) {
  if (!d.schemaVersion) d.schemaVersion = 1;
  if (d.schemaVersion === 1) {
    // v2: 設定・口座アーカイブ・クレカ締め日/支払日・割り勘カテゴリ
    d.settings = d.settings || {};
    d.accounts.forEach(a => {
      if (a.archived === undefined) a.archived = false;
      if (a.kind === "credit") {
        if (!a.closingDay) a.closingDay = 31;
        if (!a.payDay) a.payDay = 27;
      }
      if (a.id === "ufj_card" || a.id === "sbi_shinsei") a.archived = true; // 解約済み
    });
    if (!d.categories.some(c => c.id === "warikan")) {
      d.categories.push({ id:"warikan", name:"割り勘", type:"income", offsetExpense:true,
        sortOrder: Math.max(0, ...d.categories.map(c => c.sortOrder)) + 1 });
    }
    d.schemaVersion = 2;
  }
  if (d.schemaVersion === 2) {
    // v3: 月予算・カテゴリ予算・クレカ引き落とし口座
    d.settings = d.settings || {};
    if (d.settings.monthlyBudget === undefined) d.settings.monthlyBudget = 60000;
    if (!d.settings.categoryBudgets) {
      d.settings.categoryBudgets = {};
      if (d.categories.some(c => c.id === "food")) d.settings.categoryBudgets.food = 21000;
      if (d.categories.some(c => c.id === "beauty")) d.settings.categoryBudgets.beauty = 6000;
    }
    d.accounts.forEach(a => { if (a.kind === "credit" && a.payFromId === undefined) a.payFromId = null; });
    const smcc = d.accounts.find(a => a.id === "smcc_card");
    if (smcc && !smcc.payFromId && d.accounts.some(a => a.id === "sumishin")) smcc.payFromId = "sumishin";
    d.schemaVersion = 3;
  }
  // 将来のアップデートでデータ形式を変えるときは、ここに変換処理を追加する
  return d;
}
function freshSeed() { return migrate(JSON.parse(JSON.stringify(SEED_DATA || DEFAULT_DATA))); }
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { const d = freshSeed(); persist(d); return d; }
    return migrate(JSON.parse(raw));
  } catch (e) {
    console.error("データ読み込み失敗:", e);
    return freshSeed();
  }
}
function persist(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d || state)); }

let state = loadData();

/* ---------------- ユーティリティ ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const yen = n => "¥" + Math.abs(Math.round(n)).toLocaleString("ja-JP");
const uid = () => "tx-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
const WEEK = ["日","月","火","水","木","金","土"];
const WEEK_EN = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
const acc = id => state.accounts.find(a => a.id === id);
const cat = id => state.categories.find(c => c.id === id);

const CAT_ICONS = { food:"🍜", daily:"🧴", transport:"🚃", fun:"🎮", date:"💑", beauty:"💇", fashion:"👕", social:"🎁", health:"💊", edu:"📖", subsc:"📱", invest:"📈", other:"📦", salary:"💼", pocket:"💰", misc_in:"🪙", warikan:"🤝" };
const catIcon = c => (c && (c.icon || CAT_ICONS[c.id])) || "🏷";
const accIcon = a => !a ? "💼" : a.kind === "credit" ? "💳" : a.group === "現金" ? "💵" : a.group === "PayPay" ? "📱" : "🏦";

/* ---------------- モーダル(alert/confirm/prompt代替) ---------------- */
function dialog(opt) {
  return new Promise(resolve => {
    const ov = document.createElement("div");
    ov.className = "modal-overlay";
    ov.innerHTML = `<div class="modal">${opt.html}</div>`;
    document.body.appendChild(ov);
    const done = v => { ov.remove(); resolve(v); };
    ov.addEventListener("click", e => {
      if (e.target === ov) { done(opt.cancelValue); return; }
      const b = e.target.closest("[data-md]");
      if (b) opt.onAction(b.dataset.md, done, ov);
    });
    if (opt.onOpen) opt.onOpen(ov);
    const inp = ov.querySelector("input[type=text],input[type=number]");
    if (inp && opt.autofocus !== false) inp.focus();
  });
}
function alertDialog(msg) {
  return dialog({
    html: `<p>${esc(msg)}</p><div class="btns"><button class="ok" data-md="ok">OK</button></div>`,
    cancelValue: undefined, onAction: (a, done) => done()
  });
}
function confirmDialog(msg, opt = {}) {
  return dialog({
    html: `<p>${esc(msg)}</p><div class="btns"><button class="cancel" data-md="c">キャンセル</button><button class="ok ${opt.danger ? "danger" : ""}" data-md="ok">${esc(opt.okText || "OK")}</button></div>`,
    cancelValue: false, onAction: (a, done) => done(a === "ok")
  });
}
function promptDialog(title, value = "", opt = {}) {
  return dialog({
    html: `<p>${esc(title)}</p><input id="md-input" type="${opt.type || "text"}" value="${esc(value)}"><div class="btns"><button class="cancel" data-md="c">キャンセル</button><button class="ok" data-md="ok">OK</button></div>`,
    cancelValue: null,
    onAction: (a, done, ov) => done(a === "ok" ? ov.querySelector("#md-input").value : null),
    onOpen: ov => {
      ov.querySelector("#md-input").addEventListener("keydown", e => {
        if (e.key === "Enter") ov.querySelector('[data-md="ok"]').click();
      });
    }
  });
}
// 口座の追加・編集モーダル
function accountDialog(a) {
  const groups = orderedGroups();
  const isNew = !a;
  const closeSel = sel => Array.from({length:30}, (_,i) => `<option value="${i+1}" ${sel===i+1?"selected":""}>${i+1}日</option>`).join("") + `<option value="31" ${(!sel||sel===31)?"selected":""}>月末</option>`;
  const paySel = sel => Array.from({length:31}, (_,i) => `<option value="${i+1}" ${(sel||27)===i+1?"selected":""}>${i+1}日</option>`).join("");
  const fromSel = sel => `<option value="">(設定しない)</option>` + state.accounts.filter(x => x.kind !== "credit" && !x.archived)
    .map(x => `<option value="${x.id}" ${sel===x.id?"selected":""}>${esc(x.name)}</option>`).join("");
  return dialog({
    html: `
      <p class="md-title">${isNew ? "口座を追加" : "口座を編集"}</p>
      <label>名前</label><input id="md-name" type="text" value="${a ? esc(a.name) : ""}" placeholder="例: 楽天銀行">
      <label>グループ</label><input id="md-group" type="text" list="md-groups" value="${a ? esc(a.group) : ""}" placeholder="例: 銀行">
      <datalist id="md-groups">${groups.map(g => `<option value="${esc(g)}">`).join("")}</datalist>
      <label>種類</label>
      <select id="md-kind">
        <option value="asset" ${(!a || a.kind === "asset") ? "selected" : ""}>資産(現金・銀行・電子マネー)</option>
        <option value="credit" ${a && a.kind === "credit" ? "selected" : ""}>クレジットカード</option>
      </select>
      <label>初期残高(円)</label><input id="md-init" type="number" value="${a ? (a.initialBalance || 0) : 0}">
      <div id="md-credit" style="display:${a && a.kind === "credit" ? "block" : "none"}">
        <label>締め日</label><select id="md-close">${closeSel(a && a.closingDay)}</select>
        <label>支払日(締め日の翌月)</label><select id="md-pay">${paySel(a && a.payDay)}</select>
        <label>引き落とし口座(残高チェックに使用)</label><select id="md-from">${fromSel(a && a.payFromId)}</select>
      </div>
      <div class="btns"><button class="cancel" data-md="c">キャンセル</button><button class="ok" data-md="ok">${isNew ? "追加" : "保存"}</button></div>`,
    cancelValue: null, autofocus: false,
    onOpen: ov => {
      ov.querySelector("#md-kind").addEventListener("change", e => {
        ov.querySelector("#md-credit").style.display = e.target.value === "credit" ? "block" : "none";
      });
    },
    onAction: (act, done, ov) => {
      if (act !== "ok") { done(null); return; }
      const name = ov.querySelector("#md-name").value.trim();
      if (!name) { toast("名前を入力してください"); return; }
      done({
        name,
        group: ov.querySelector("#md-group").value.trim() || "その他",
        kind: ov.querySelector("#md-kind").value,
        initialBalance: Math.round(Number(ov.querySelector("#md-init").value)) || 0,
        closingDay: Number(ov.querySelector("#md-close").value),
        payDay: Number(ov.querySelector("#md-pay").value),
        payFromId: ov.querySelector("#md-from").value || null
      });
    }
  });
}

/* ---------------- 集計 ---------------- */
function balances() {
  const b = {};
  state.accounts.forEach(a => b[a.id] = a.initialBalance || 0);
  state.transactions.forEach(t => {
    for (const k in t.amounts) if (k in b) b[k] += t.amounts[k];
  });
  return b;
}
function totalAssets(b) { return state.accounts.filter(a => a.kind !== "credit").reduce((s,a) => s + b[a.id], 0); }
function totalCredit(b) { return state.accounts.filter(a => a.kind === "credit").reduce((s,a) => s + b[a.id], 0); }
function txAmount(t) {
  const vals = Object.values(t.amounts);
  if (!vals.length) return 0;
  if (t.type === "transfer") return Math.max(...vals.map(Math.abs));
  let s = 0;
  for (const k in t.amounts) {
    const a = acc(k), v = t.amounts[k];
    const credit = a && a.kind === "credit";
    if (t.type === "expense") s += credit ? v : -v;
    else s += credit ? -v : v;
  }
  return s;
}
function monthTx(ym) {
  return state.transactions
    .filter(t => t.date && t.date.slice(0,7) === ym)
    .sort((x,y) => y.date.localeCompare(x.date) || state.transactions.indexOf(y) - state.transactions.indexOf(x));
}
function monthSummary(ym) {
  let inc = 0, exp = 0;
  monthTx(ym).forEach(t => {
    if (t.type === "income") {
      const c = cat(t.categoryId);
      if (c && c.offsetExpense) exp -= txAmount(t); // 割り勘: 支出から差し引く
      else inc += txAmount(t);
    }
    else if (t.type === "expense") exp += txAmount(t);
  });
  return { inc, exp };
}
function expenseByCategory(ym) {
  const m = {};
  monthTx(ym).forEach(t => {
    if (t.type !== "expense") return;
    const k = t.categoryId || "_none";
    m[k] = (m[k] || 0) + txAmount(t);
  });
  return Object.entries(m).filter(e => e[1] > 0).sort((a,b) => b[1] - a[1]);
}
function todaySpent() {
  const td = todayStr();
  let s = 0;
  state.transactions.forEach(t => { if (t.date === td && t.type === "expense") s += txAmount(t); });
  return s;
}
/* ---- クレカ請求の支払日別集計(カード内訳つき) ---- */
function nextYM(y, m) { m++; if (m > 12) { m = 1; y++; } return { y, m }; }
function lastDay(y, m) { return new Date(y, m, 0).getDate(); }
function cardPaymentsDetailed() {
  const map = {}; // "YYYY-MM-DD" → { amount, cards: {accId: 金額} }
  state.accounts.filter(a => a.kind === "credit").forEach(a => {
    const c = a.closingDay || 31, p = a.payDay || 27;
    const bills = {};
    let firstKey = null;
    state.transactions.forEach(t => {
      const v = t.amounts[a.id];
      if (v === undefined || !t.date) return;
      const [y, m, d] = t.date.split("-").map(Number);
      let py, pm;
      if (v > 0) {
        let cy = y, cm = m;
        if (d > Math.min(c, lastDay(y, m))) ({ y: cy, m: cm } = nextYM(y, m));
        ({ y: py, m: pm } = nextYM(cy, cm));
      } else { py = y; pm = m; }
      const key = py + "-" + String(pm).padStart(2, "0");
      bills[key] = (bills[key] || 0) + v;
      if (!firstKey || key < firstKey) firstKey = key;
    });
    if (a.initialBalance) {
      let k = firstKey;
      if (!k) {
        const t = todayStr();
        const { y, m } = nextYM(Number(t.slice(0, 4)), Number(t.slice(5, 7)));
        k = y + "-" + String(m).padStart(2, "0");
      }
      bills[k] = (bills[k] || 0) + a.initialBalance;
    }
    Object.keys(bills).forEach(k => {
      if (!bills[k]) return;
      const y = Number(k.slice(0, 4)), m = Number(k.slice(5, 7));
      const date = k + "-" + String(Math.min(p, lastDay(y, m))).padStart(2, "0");
      if (!map[date]) map[date] = { amount: 0, cards: {} };
      map[date].amount += bills[k];
      map[date].cards[a.id] = (map[date].cards[a.id] || 0) + bills[k];
    });
  });
  return Object.keys(map).sort().filter(d => map[d].amount !== 0)
    .map(d => ({ date: d, amount: map[d].amount, cards: map[d].cards }));
}
function cardPayments() { return cardPaymentsDetailed().map(p => ({ date: p.date, amount: p.amount })); }

/* ---- 表示ヘルパ ---- */
function transferLabel(t) {
  const from = [], to = [];
  for (const k in t.amounts) {
    const a = acc(k); if (!a) continue;
    const v = t.amounts[k], credit = a.kind === "credit";
    if ((v < 0 && !credit) || (v > 0 && credit)) from.push(a.name);
    else to.push(a.name);
  }
  if (from.length && to.length) return from.join(",") + " → " + to.join(",");
  return from.concat(to).join(", ");
}
function txSub(t, withDate) {
  const parts = [];
  if (withDate) parts.push(Number(t.date.slice(5,7)) + "/" + Number(t.date.slice(8,10)));
  if (t.type === "transfer") { parts.push("振替"); parts.push(transferLabel(t)); }
  else {
    const c = cat(t.categoryId);
    parts.push(c ? c.name : "未分類");
    parts.push(Object.keys(t.amounts).map(k => { const a = acc(k); return a ? a.name : "?"; }).join(", "));
  }
  return parts.join(" ・ ");
}
function txIcon(t) { return t.type === "transfer" ? "🔁" : catIcon(cat(t.categoryId)); }
function txAmountHtml(t) {
  const v = txAmount(t);
  if (t.type === "expense") return `<div class="a exp num">−${yen(v)}</div>`;
  if (t.type === "income")  return `<div class="a inc num">+${yen(v)}</div>`;
  return `<div class="a trf num">${yen(v)}</div>`;
}
function txItemHtml(t, withDate) {
  return `<div class="tx tappable" data-action="edit-tx" data-id="${t.id}">
    <div class="sil">${txIcon(t)}</div>
    <div class="body"><div class="n">${esc(t.name)}</div><div class="s">${esc(txSub(t, withDate))}</div></div>
    ${txAmountHtml(t)}
  </div>`;
}
function ransomHtml(text) { return `<div class="ransom">${[...text].map(ch => `<span>${esc(ch)}</span>`).join("")}</div>`; }
function orderedGroups() {
  const seen = [], sorted = state.accounts.slice().sort((x,y) => x.sortOrder - y.sortOrder);
  sorted.forEach(a => { if (!seen.includes(a.group)) seen.push(a.group); });
  return seen;
}
// よく使う記録名(頻度順)
function frequentNames(n) {
  const cnt = {};
  state.transactions.forEach(t => {
    if (t.type !== "expense" || !t.name) return; // クイックチップは支出の記録名のみ
    if (t.name.startsWith("残高調整")) return;
    cnt[t.name] = (cnt[t.name] || 0) + 1;
  });
  return Object.keys(cnt).sort((a,b) => cnt[b] - cnt[a]).slice(0, n);
}
function lastTxByName(name) {
  let best = null;
  state.transactions.forEach(t => { if (t.name === name && (!best || t.date >= best.date)) best = t; });
  return best;
}
function lastChargeRoute() {
  let best = null;
  state.transactions.forEach(t => {
    if (t.type !== "transfer") return;
    const ent = Object.entries(t.amounts);
    if (ent.length !== 2) return;
    const neg = ent.find(e => e[1] < 0), pos = ent.find(e => e[1] > 0);
    if (!neg || !pos) return;
    const from = acc(neg[0]), to = acc(pos[0]);
    if (!from || !to || from.kind === "credit" || to.kind === "credit") return;
    if (!best || t.date >= best.t.date) best = { t, fromId: neg[0], toId: pos[0] };
  });
  return best ? { fromId: best.fromId, toId: best.toId } : null;
}

function quickSave() {
  const amt = Math.round(Number(qAmount));
  if (!amt || amt <= 0) { toast("金額を入力してください"); return; }
  const date = todayStr();
  let tx = null;
  if (qMode === "charge") {
    const route = lastChargeRoute();
    if (!route) { toast("詳細入力から口座を指定してください"); return; }
    tx = { id: uid(), date, name: "チャージ", type: "transfer", categoryId: null,
      amounts: { [route.fromId]: -amt, [route.toId]: amt } };
  } else if (qMode === "warikan") {
    if (!qAccountId) { toast("受け取り口座を選んでください"); return; }
    const a = acc(qAccountId);
    tx = { id: uid(), date, name: "割り勘", type: "income", categoryId: "warikan",
      amounts: { [qAccountId]: a.kind === "credit" ? -amt : amt } };
  } else {
    if (!qAccountId) { toast("口座を選んでください"); return; }
    const a = acc(qAccountId);
    const name = qName || "支出";
    tx = { id: uid(), date, name, type: "expense", categoryId: quickCategoryOf(name),
      amounts: { [qAccountId]: a.kind === "credit" ? amt : -amt } };
  }
  state.transactions.push(tx);
  persist();
  toast("記録しました!");
  qAmount = "";
  viewMonth = date.slice(0,7);
  showScreen("scr-home");
}

}

function saveTx() {
  const date = $("#in-date").value;
  if (!date) { toast("日付を入力してください"); return; }
  let name = $("#in-name").value.trim();
  const amounts = {};

  if (inputType === "transfer") {
    if ($("#trf-from")) {
      const fromId = $("#trf-from").value, toId = $("#trf-to").value;
      const amt = Math.round(Number($("#trf-amount").value));
      if (!amt || amt <= 0) { toast("金額を入力してください"); return; }
      if (fromId === toId) { toast("移動元と移動先が同じです"); return; }
      const f = acc(fromId), t = acc(toId);
      amounts[fromId] = f.kind === "credit" ? amt : -amt;
      amounts[toId]   = t.kind === "credit" ? -amt : amt;
      if (!name) name = t.kind === "credit" ? "引き落とし" : "振替";
    } else {
      state.accounts.forEach(a => {
        const el = $("#raw-" + a.id);
        if (el && el.value !== "") { const v = Math.round(Number(el.value)); if (v) amounts[a.id] = v; }
      });
      if (!Object.keys(amounts).length) { toast("金額を入力してください"); return; }
      if (!name) name = "振替";
    }
  } else {
    state.accounts.forEach(a => {
      const el = $("#amt-" + a.id);
      if (el && el.value !== "") {
        const v = Math.round(Math.abs(Number(el.value)));
        if (v > 0) {
          const credit = a.kind === "credit";
          amounts[a.id] = inputType === "expense" ? (credit ? v : -v) : (credit ? -v : v);
        }
      }
    });
    if (!Object.keys(amounts).length) { toast("金額を入力してください"); return; }
    if (!name) { const c = cat(selectedCatId); name = c ? c.name : (inputType === "income" ? "収入" : "支出"); }
  }

  if (editingId) {
    const t = state.transactions.find(t => t.id === editingId);
    t.date = date; t.name = name; t.type = inputType;
    t.categoryId = inputType === "transfer" ? null : selectedCatId;
    t.amounts = amounts;
    toast("更新しました");
  } else {
    state.transactions.push({ id: uid(), date, name, type: inputType, categoryId: inputType === "transfer" ? null : selectedCatId, amounts });
    toast("保存しました");
  }
  persist();
  viewMonth = date.slice(0,7);
  const dest = editingId ? "scr-history" : "scr-home";
  editingId = null;
  showScreen(dest);
}
async function deleteTx() {
  const t = state.transactions.find(t => t.id === editingId);
  if (!t) return;
  if (!await confirmDialog(`「${t.name}」(${t.date})を削除しますか?`, { danger: true, okText: "削除" })) return;
  state.transactions = state.transactions.filter(x => x.id !== editingId);
  persist();
  editingId = null;
  toast("削除しました");
  showScreen("scr-history");
}
function openEdit(id) {
  const t = state.transactions.find(t => t.id === id);
  if (!t) return;
  editingId = id;
  inputMode = "detail";
  inputType = t.type;
  selectedCatId = t.categoryId;
  showScreen("scr-input", true);
}

/* ---------------- 分析 ---------------- */
function prevMonth(ym) {
  let y = Number(ym.slice(0,4)), m = Number(ym.slice(5,7)) - 1;
  if (m < 1) { m = 12; y--; }
  return y + "-" + String(m).padStart(2,"0");
}
function pctDiff(cur, prev) {
  if (!prev) return "—";
  const p = Math.round((cur - prev) / prev * 100);
  return (p >= 0 ? "+" : "−") + Math.abs(p) + "%";
}
function renderAnalysis() {
  const sum = monthSummary(viewMonth);
  const prev = monthSummary(prevMonth(viewMonth));
  const byCat = expenseByCategory(viewMonth);
  const maxV = byCat.length ? byCat[0][1] : 1;

  const bars = byCat.map(([cid, v]) => {
    const c = cat(cid);
    return `<div class="bar-row">
      <div class="lb">${c ? esc(c.name) : "未分類"}</div>
      <div class="track"><div class="fill" style="width:${Math.max(3, Math.round(v / maxV * 100))}%"></div></div>
      <div class="val num">${yen(v)}</div>
    </div>`;
  }).join("");

  const budgets = state.settings.categoryBudgets || {};
  const spentByCat = Object.fromEntries(byCat);
  const budgetRows = Object.keys(budgets).filter(cid => budgets[cid] > 0).map(cid => {
    const c = cat(cid); if (!c) return "";
    const bud = budgets[cid], sp = spentByCat[cid] || 0;
    const pct = Math.min(100, Math.round(sp / bud * 100));
    const over = sp > bud, warn = !over && pct >= 80;
    const status = over ? `<span class="warn">${yen(sp - bud)}オーバー!</span>`
      : warn ? `<span class="warn">残り${yen(bud - sp)}!</span>`
      : `<span class="ok">✓ 残り${yen(bud - sp)}</span>`;
    return `<div class="budget-line">
      <div class="top"><span>${catIcon(c)} ${esc(c.name)}</span><span>${status} <span class="r num">${yen(sp)}/${yen(bud)}</span></span></div>
      <div class="btrack"><div class="bfill ${over || warn ? "bf-warn" : "bf-ok"}" style="width:${pct}%"></div></div>
    </div>`;
  }).join("");

  $("#scr-analysis").innerHTML = `
    ${monthNavHtml()}
    <div class="kpi2">
      <div class="kpi"><div class="t en">支出 EXPENSE</div><div class="v num" style="color:var(--red2)">${yen(sum.exp)}</div><div class="d">先月比 ${pctDiff(sum.exp, prev.exp)}</div></div>
      <div class="kpi"><div class="t en">収入 INCOME</div><div class="v num" style="color:var(--cyan)">${yen(sum.inc)}</div><div class="d">先月比 ${pctDiff(sum.inc, prev.inc)}</div></div>
    </div>
    <div class="sec-head">${ransomHtml("カテゴリ別")}<div class="en">BY CATEGORY</div></div>
    <div class="panel">${bars || '<div class="empty">この月の支出はありません</div>'}</div>
    <div class="sec-head">${ransomHtml("予算")}<div class="en">BUDGET STATUS</div></div>
    <div class="panel">
      ${budgetRows || '<div class="empty">カテゴリ予算が未設定です</div>'}
      <div class="hint">※ 予算は設定画面で編集できます(月予算・カテゴリ予算)。</div>
    </div>
  `;
}

/* ---------------- 履歴 ---------------- */
function renderHistory() {
  const txs = monthTx(viewMonth);
  let html = monthNavHtml();
  if (!txs.length) {
    html += '<div class="empty">この月の記録はまだありません<br>「★」から追加できます</div>';
  } else {
    const byDate = {};
    txs.forEach(t => { (byDate[t.date] = byDate[t.date] || []).push(t); });
    Object.keys(byDate).sort((a,b) => b.localeCompare(a)).forEach(dt => {
      const d = new Date(dt + "T00:00:00");
      html += `<div class="date-head2"><b>${d.getMonth()+1}/${d.getDate()}</b> ${WEEK[d.getDay()]}曜日</div>`;
      html += byDate[dt].map(t => txItemHtml(t, false)).join("");
    });
    html += '<div class="empty" style="padding:14px 0 0">記録をタップすると編集・削除できます</div>';
  }
  $("#scr-history").innerHTML = html;
}

/* ---- 設定の操作 ---- */
async function budgetMonth() {
  const v = await promptDialog("月予算(円)を入力(0で非表示)", state.settings.monthlyBudget || 0, { type: "number" });
  if (v === null) return;
  const n = Math.round(Number(v));
  if (isNaN(n) || n < 0) { toast("数値を入力してください"); return; }
  state.settings.monthlyBudget = n;
  persist(); renderSettings(); toast("変更しました");
}
async function budgetCat(id) {
  const c = cat(id); if (!c) return;
  const cur = (state.settings.categoryBudgets || {})[id] || 0;
  const v = await promptDialog(`「${c.name}」の月予算(円)を入力(0で解除)`, cur, { type: "number" });
  if (v === null) return;
  const n = Math.round(Number(v));
  if (isNaN(n) || n < 0) { toast("数値を入力してください"); return; }
  if (!state.settings.categoryBudgets) state.settings.categoryBudgets = {};
  if (n === 0) delete state.settings.categoryBudgets[id];
  else state.settings.categoryBudgets[id] = n;
  persist(); renderSettings(); toast("変更しました");
}
async function catRename(id) {
  const c = cat(id); if (!c) return;
  const name = await promptDialog("カテゴリ名を変更", c.name);
  if (name && name.trim()) { c.name = name.trim(); persist(); renderSettings(); toast("変更しました"); }
}
async function catDel(id) {
  const c = cat(id); if (!c) return;
  const used = state.transactions.filter(t => t.categoryId === id).length;
  if (!await confirmDialog(`カテゴリ「${c.name}」を削除しますか?` + (used ? `\n(使用中の${used}件の記録は「未分類」になります)` : ""), { danger: true, okText: "削除" })) return;
  state.categories = state.categories.filter(x => x.id !== id);
  state.transactions.forEach(t => { if (t.categoryId === id) t.categoryId = null; });
  if (state.settings.categoryBudgets) delete state.settings.categoryBudgets[id];
  persist(); renderSettings(); toast("削除しました");
}
function catAdd() {
  const name = $("#new-cat-name").value.trim();
  if (!name) { toast("カテゴリ名を入力してください"); return; }
  const sel = $("#new-cat-type").value;
  const c = { id: "cat-" + Date.now().toString(36), name, type: sel === "expense" ? "expense" : "income", sortOrder: Math.max(0, ...state.categories.map(c => c.sortOrder)) + 1 };
  if (sel === "offset") c.offsetExpense = true;
  state.categories.push(c);
  persist(); renderSettings(); toast("追加しました");
}
async function accEdit(id) {
  const a = acc(id); if (!a) return;
  const v = await accountDialog(a);
  if (!v) return;
  a.name = v.name; a.group = v.group; a.kind = v.kind; a.initialBalance = v.initialBalance;
  if (a.kind === "credit") { a.closingDay = v.closingDay; a.payDay = v.payDay; a.payFromId = v.payFromId; }
  persist(); renderSettings(); toast("保存しました");
}
function accArchive(id) {
  const a = acc(id); if (!a) return;
  a.archived = !a.archived;
  persist(); renderSettings();
  toast(a.archived ? `「${a.name}」を使わない口座にしました` : `「${a.name}」を元に戻しました`);
}
async function accDel(id) {
  const a = acc(id); if (!a) return;
  const used = state.transactions.filter(t => t.amounts[id] !== undefined).length;
  if (used) {
    if (await confirmDialog(`「${a.name}」は${used}件の記録で使われているため削除できません。\n代わりに「使わない口座」(アーカイブ)にしますか?\n過去の記録はそのまま残り、入力画面に表示されなくなります。`, { okText: "アーカイブする" })) {
      a.archived = true; persist(); renderSettings(); toast("アーカイブしました");
    }
    return;
  }
  if (!await confirmDialog(`口座「${a.name}」を削除しますか?`, { danger: true, okText: "削除" })) return;
  state.accounts = state.accounts.filter(x => x.id !== id);
  persist(); renderSettings(); toast("削除しました");
}
async function accAdd() {
  const v = await accountDialog(null);
  if (!v) return;
  const a = { id: "acc-" + Date.now().toString(36), name: v.name, kind: v.kind, group: v.group,
    initialBalance: v.initialBalance, sortOrder: Math.max(0, ...state.accounts.map(a => a.sortOrder)) + 1, archived: false };
  if (a.kind === "credit") { a.closingDay = v.closingDay; a.payDay = v.payDay; a.payFromId = v.payFromId; }
  state.accounts.push(a);
  persist(); renderSettings(); toast("追加しました");
}

/* ---- エクスポート / インポート / リセット ---- */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kakeibo-backup-" + todayStr() + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("エクスポートしました");
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.accounts) || !Array.isArray(d.categories) || !Array.isArray(d.transactions))
        throw new Error("家計簿のバックアップファイルではありません");
      if (!await confirmDialog(`現在のデータを置き換えます。\n読み込む記録: ${d.transactions.length}件\nよろしいですか?`, { okText: "インポート" })) return;
      state = migrate(d);
      persist();
      toast("インポートしました");
      render();
    } catch (e) { alertDialog("インポートに失敗しました: " + e.message); }
  };
  reader.readAsText(file);
}
async function resetData() {
  if (!await confirmDialog("全データを削除して初期状態に戻します。よろしいですか?", { danger: true, okText: "リセット" })) return;
  if (!await confirmDialog("本当によろしいですか?この操作は取り消せません。\n(必要なら先にエクスポートしてください)", { danger: true, okText: "実行する" })) return;
  localStorage.removeItem(STORAGE_KEY);
  state = loadData();
  toast("リセットしました");
  render();
}

/* ---------------- ナビ・描画 ---------------- */
function showScreen(id, keepEdit) {
  if (id === "scr-input" && !keepEdit) {
    editingId = null;
    if (currentScreen !== "scr-input") { inputMode = "quick"; inputType = "expense"; selectedCatId = null; qAmount = ""; }
  }
  currentScreen = id;
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.scr === id));
  render();
  window.scrollTo(0, 0);
}
function render() {
  if (currentScreen === "scr-home") renderHome();
  else if (currentScreen === "scr-input") renderInput();
  else if (currentScreen === "scr-analysis") renderAnalysis();
  else if (currentScreen === "scr-history") renderHistory();
  else renderSettings();
}
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2000);
}

/* ---------------- イベント ---------------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const act = el.dataset.action, id = el.dataset.id;
  switch (act) {
    case "nav": showScreen(el.dataset.scr); break;
    case "month-prev": shiftMonth(-1); break;
    case "month-next": shiftMonth(1); break;
    /* --- クイック入力 --- */
    case "quick-name": qMode = "expense"; qName = el.dataset.name; qAccountId = defaultQuickAccount(qName); qAmount = ""; inputMode = "quick"; editingId = null; showScreen("scr-input", true); break;
    case "quick-charge":
      qMode = "charge"; qAmount = qAmount || ""; inputMode = "quick"; editingId = null;
      if (currentScreen === "scr-input") renderQuick(); else showScreen("scr-input", true);
      break;
    case "quick-warikan":
      qMode = "warikan"; qAccountId = qAccountId || defaultQuickAccount(null); inputMode = "quick"; editingId = null;
      if (currentScreen === "scr-input") renderQuick(); else showScreen("scr-input", true);
      break;
    case "quick-blank": qMode = "expense"; qName = null; qAmount = ""; inputMode = "quick"; editingId = null; showScreen("scr-input", true); break;
    case "q-name": qMode = "expense"; qName = el.dataset.name; qAccountId = defaultQuickAccount(qName); renderQuick(); break;
    case "q-free": {
      const n = await promptDialog("記録の名前を入力", "");
      if (n && n.trim()) { qMode = "expense"; qName = n.trim(); qAccountId = defaultQuickAccount(qName); renderQuick(); }
      break;
    }
    case "q-acc": qAccountId = id; renderQuick(); break;
    case "q-key": {
      const k = el.dataset.k;
      if (qAmount.length < 8) qAmount = (qAmount + k).replace(/^0+(?=\d)/, "");
      renderQuick();
      break;
    }
    case "q-del": qAmount = qAmount.slice(0, -1); renderQuick(); break;
    case "q-save": quickSave(); break;
    case "to-detail": inputMode = "detail"; inputType = qMode === "charge" ? "transfer" : qMode === "warikan" ? "income" : "expense"; if (qMode === "warikan") selectedCatId = "warikan"; renderInput(); break;
    case "to-quick": inputMode = "quick"; renderQuick(); break;
    /* --- 詳細フォーム --- */
    case "set-type": {
      const keep = { date: $("#in-date") && $("#in-date").value, name: $("#in-name") && $("#in-name").value };
      inputType = el.dataset.type;
      renderInput();
      if (keep.date && $("#in-date")) $("#in-date").value = keep.date;
      if (keep.name && $("#in-name")) $("#in-name").value = keep.name;
      break;
    }
    case "set-cat":
      selectedCatId = id;
      document.querySelectorAll('[data-action="set-cat"]').forEach(c => c.classList.toggle("sel", c.dataset.id === id));
      break;
    case "save-tx": saveTx(); break;
    case "delete-tx": deleteTx(); break;
    case "edit-tx": openEdit(id); break;
    /* --- 設定 --- */
    case "budget-month": budgetMonth(); break;
    case "budget-cat": budgetCat(id); break;
    case "cat-rename": catRename(id); break;
    case "cat-del": catDel(id); break;
    case "cat-add": catAdd(); break;
    case "acc-edit": accEdit(id); break;
    case "acc-arch": accArchive(id); break;
    case "acc-del": accDel(id); break;
    case "acc-add": accAdd(); break;
    case "export": exportData(); break;
    case "import": $("#import-file").click(); break;
    case "reset": resetData(); break;
  }
});
$("#import-file").addEventListener("change", e => {
  if (e.target.files.length) importData(e.target.files[0]);
  e.target.value = "";
});

/* ---------------- 起動 ---------------- */
showScreen("scr-home");

// PWA: Service Worker登録(https配信時のみ)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("./sw.js").catch(e => console.warn("SW登録失敗:", e));
}
