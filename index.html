  smcc:     /三井住友カ|ミツイスミトモカ|smbcカード|vpass/
};
// ヘッダ名から列の役割を判定する(空白を除いたヘッダ名に当てる)
const CSV_COL = {
  date:   c => /日付|取引日|利用日|年月日|取扱日|約定日/.test(c) && !/締|支払日|引落日/.test(c),
  store:  c => /取引先|利用店|ご利用先|店名|加盟店/.test(c),
  desc:   c => /摘要|内容|明細|取引名/.test(c) && !/メモ/.test(c),
  out:    c => /出金|お支払|支払金額|お引出|引出|利用金額|引落|支出/.test(c) && !/海外|区分|方法|回数|予定|残高|手数料/.test(c),
  in:     c => /入金|お預入|お預り|預入|受取|収入/.test(c) && !/海外|区分|方法|残高/.test(c),
  amount: c => /^(お?取引)?金額(\(円\))?$/.test(c),
  method: c => /取引方法|支払方法|支払い方法|決済方法/.test(c)
};
// 名前からのカテゴリ推定(過去に同じ名前の記録が無いときだけ使う)。上から順に判定
const CSV_CAT_RULES = [
  ["subsc", /netflix|spotify|apple\.com|apple com|itunes|youtube|amazon ?prime|プライム会費|disney|u-next|dazn|abema|chatgpt|openai|anthropic|claude|adobe|icloud/],
  ["transport", /jr|鉄道|メトロ|電鉄|バス|タクシー|suica|pasmo|icoca|eneos|出光|コスモ石油|駐車場|高速道路/],
  ["fun", /steam|任天堂|nintendo|playstation|映画|toho|シネマ|カラオケ|ラウンドワン|チケット/],
  ["health", /薬局|ドラッグ|マツモトキヨシ|マツキヨ|ウエルシア|スギ薬局|サンドラッグ|ツルハ|ココカラ|クリニック|病院|医院|歯科/],
  ["daily", /ダイソー|セリア|キャンドゥ|ニトリ|無印|ロフト|ハンズ|ドン・?キホーテ|ドンキ/],
  ["fashion", /ユニクロ|uniqlo|zara|しまむら|h&m/],
  ["beauty", /美容|ヘアサロン|hair|salon/],
  ["food", /セブン|ローソン|ファミリーマート|ファミマ|ミニストップ|マクドナルド|スターバックス|スタバ|すき家|吉野家|松屋|ケンタッキー|サイゼリヤ|ガスト|モスバーガー|スシロー|くら寿司|はま寿司|イオン|まいばすけっと|西友|業務スーパー|オーケー|uber ?eats|出前館|wolt/]
];

let csvTargetId = null;   // どの口座に取り込むか(ファイル選択の間だけ保持)

const nk = s => String(s == null ? "" : s).normalize("NFKC").trim();   // 全角英数・半角カナをそろえる

async function readCsvFile(file) {
  const buf = await file.arrayBuffer();
  let text = new TextDecoder("utf-8").decode(buf);
  // 銀行のCSVは Shift_JIS が多い。UTF-8 として読めなければ読み直す
  if (text.indexOf("�") >= 0) {
    try { text = new TextDecoder("shift_jis").decode(buf); } catch (e) { /* 非対応ブラウザは UTF-8 のまま */ }
  }
  return text.replace(/^﻿/, "");
}
/* ダブルクォート・カンマ・改行入りのセルに対応。タブ区切りも自動判定 */
function parseCsv(text) {
  const head = text.slice(0, 2000);
  const delim = head.split("\t").length > head.split(",").length ? "\t" : ",";
  const rows = [];
  let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function csvDate(s) {
  const t = nk(s);
  const m = t.match(/(\d{4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/) || t.match(/^(\d{4})(\d{2})(\d{2})(?!\d)/);
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  if (y < 2000 || y > 2100 || mo < 1 || mo > 12 || d < 1 || d > lastDay(y, mo)) return null;
  return y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}
function csvAmount(s) {
  let t = nk(s).replace(/[¥,円\s]/g, "");
  let neg = false;
  if (/^[-−▲△]/.test(t)) { neg = true; t = t.slice(1); }
  else if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  if (!/^\d+(\.\d+)?$/.test(t)) return null;
  return neg ? -Number(t) : Number(t);
}
function csvHash(s) {
  let h1 = 5381, h2 = 2166136261;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = ((h1 << 5) + h1 + c) | 0;
    h2 = Math.imul(h2 ^ c, 16777619);
  }
  return (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36);
}
const dayDiff = (a, b) => Math.abs(new Date(a) - new Date(b)) / 864e5;

/* 列の割り当て m:
   { headerRow, date, store, desc:[], out, in, amount, method, spendPositive }
   out/in = 出金/入金の列、amount = 符号付き1列(spendPositive ならプラスが支出) */
function detectCsvColumns(rows, a) {
  for (let h = 0; h < Math.min(rows.length, 15); h++) {
    const cells = rows[h].map(c => nk(c).replace(/\s/g, ""));
    const find = test => cells.findIndex(test);
    const m = { headerRow: h, date: find(CSV_COL.date), store: find(CSV_COL.store), desc: [],
      out: find(CSV_COL.out), in: find(CSV_COL.in), amount: find(CSV_COL.amount), method: find(CSV_COL.method),
      spendPositive: a.kind === "credit" };
    if (m.date < 0 || (m.out < 0 && m.in < 0 && m.amount < 0)) continue;
    cells.forEach((c, i) => { if (CSV_COL.desc(c) && i !== m.store && i !== m.method) m.desc.push(i); });
    if (m.out >= 0 || m.in >= 0) m.amount = -1;
    if (m.store < 0 && !m.desc.length) {
      // 内容の列名が分からない → 日付・金額以外で最初の見出しありの列を内容とみなす
      const i = cells.findIndex((c, i) => c && ![m.date, m.out, m.in, m.amount].includes(i));
      if (i >= 0) m.store = i;
    }
    return m;
  }
  // ヘッダ無し(三井住友カード Vpass): 利用日, 利用店名, 利用金額, 支払区分, …
  const dated = rows.filter(r => csvDate(r[0])).length;
  const ok = rows.filter(r => csvDate(r[0]) && nk(r[1]) && csvAmount(r[2]) !== null).length;
  if (ok && ok >= dated * 0.8)
    return { headerRow: -1, date: 0, store: 1, desc: [], out: 2, in: -1, amount: -1, method: -1, spendPositive: true };
  return null;
}
/* CSVの行 → {date, flow, name, text, method}。flow はその口座から見た増減(マイナス = 出ていった) */
function csvRecords(rows, m) {
  const out = [];
  for (let i = m.headerRow + 1; i < rows.length; i++) {
    const r = rows[i];
    const date = csvDate(r[m.date]);
    if (!date) continue;   // 合計行・注記行など
    const vo = m.out >= 0 ? csvAmount(r[m.out]) : null;
    const vi = m.in >= 0 ? csvAmount(r[m.in]) : null;
    let flow = 0;
    if (vo) flow = -vo;    // 出金列のマイナス(返金)はプラスになる
    else if (vi) flow = vi;
    else if (m.amount >= 0) { const v = csvAmount(r[m.amount]); if (v) flow = m.spendPositive ? -v : v; }
    flow = Math.round(flow);
    if (!flow) continue;
    const store = m.store >= 0 ? nk(r[m.store]) : "";
    const desc = m.desc.map(k => nk(r[k])).filter(Boolean);
    const name = (store || desc[0] || "").replace(/\s+/g, " ").slice(0, 40) || (flow < 0 ? "支出" : "収入");
    out.push({ date, flow, name, text: [store].concat(desc).join(" "), method: m.method >= 0 ? nk(r[m.method]) : "" });
  }
  return out;
}

function accountAliases(a) {
  const res = [];
  if (CSV_ALIASES[a.importFormat]) res.push(CSV_ALIASES[a.importFormat]);
  if (a.id === "paypay_card" || /paypayカード/i.test(nk(a.name))) res.push(/paypayカ|ペイペイカ/);
  if (a.group === "現金") res.push(/atm|現金|ゲンキン|セブン銀行|ローソン銀行|イーネット/);
  const nm = nk(a.name).toLowerCase();
  // 形式のキーワードがある口座は名前では探さない(「PayPay」が「PayPayカード」に当たってしまう)
  if (!CSV_ALIASES[a.importFormat] && nm.length >= 3 && !/^(銀行|現金|クレジットカード)$/.test(nm))
    res.push(new RegExp(nm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")));
  return res;
}
/* 明細の文面に出てくる自分の別口座を探す(カード引き落とし・チャージ・ATM など) */
function findAccountIn(text, selfId) {
  const t = nk(text).toLowerCase();
  if (!t) return null;
  // カードを先に見る(「PayPayカード」を PayPay と取り違えないため)
  const list = state.accounts.filter(a => a.id !== selfId && !a.archived)
    .sort((x, y) => (y.kind === "credit") - (x.kind === "credit") || x.sortOrder - y.sortOrder);
  return list.find(a => accountAliases(a).some(re => re.test(t))) || null;
}
/* この口座へ直近でチャージした元の口座(クレカ以外)。明細に「チャージ」としか無いとき用 */
function lastChargeSource(toId) {
  let best = null;
  state.transactions.forEach(t => {
    if (t.type !== "transfer" || !(t.amounts[toId] > 0)) return;
    const from = Object.keys(t.amounts).find(k => k !== toId && t.amounts[k] < 0 && acc(k) && acc(k).kind !== "credit");
    if (from && (!best || t.date >= best.date)) best = { date: t.date, id: from };
  });
  return best ? acc(best.id) : null;
}
function guessCsvCategory(name, type) {
  const h = lastTxByName(name);
  if (h && h.type === type && h.categoryId && cat(h.categoryId)) return h.categoryId;
  const t = nk(name).toLowerCase();
  if (type === "income") {
    if (/給与|給料|賞与|ボーナス|キュウヨ|ショウヨ/.test(t) && cat("salary")) return "salary";
    return cat("misc_in") ? "misc_in" : null;
  }
  const r = CSV_CAT_RULES.find(x => cat(x[0]) && x[1].test(t));
  return r ? r[0] : (cat("other") ? "other" : null);
}

/* 取り込み候補を作る。c.skip があるものは一覧に出さない(件数だけ表示) */
function csvCandidates(recs, a) {
  const seen = {};
  const used = new Set();   // 手入力の記録は1件につき1行とだけ突き合わせる
  const txOf = (t, from, to, v) => Math.abs(t.amounts[from] || 0) === v && Math.abs(t.amounts[to] || 0) === v;
  return recs.map(r => {
    const base = [a.id, r.date, r.flow, r.name].join("|");
    seen[base] = (seen[base] || 0) + 1;   // 同じ日・同じ店・同じ額が2回あっても別物として扱う
    const c = Object.assign({}, r, { importId: "csv-" + csvHash(base + "|" + seen[base]), check: true, note: "", skip: null });
    if (state.transactions.some(t => t.importId === c.importId)) { c.skip = "done"; return c; }

    // PayPay: 残高以外(クレジット等)での支払いは PayPay残高を減らさない
    // (チャージ・受け取りなどは取引方法が空欄や「-」なので対象外)
    let payer = a;
    if (r.flow < 0 && r.method && !/^[-−ー]?$/.test(r.method) && !/残高|マネー|ポイント/.test(r.method)) {
      const card = findAccountIn(r.method, a.id);
      if (!card) { c.skip = "other"; return c; }
      payer = card;
      c.check = false;
      c.note = `${r.method}での支払い(カード明細も取り込むなら不要)`;
    }

    const v = Math.abs(r.flow);
    let other = payer === a ? findAccountIn(r.text, a.id) : null;
    const isCharge = !other && r.flow > 0 && /チャージ/.test(r.text);
    if (isCharge) other = lastChargeSource(a.id);
    if (other) {
      const from = r.flow < 0 ? a : other, to = r.flow < 0 ? other : a;
      c.tx = { type: "transfer", categoryId: null, name: r.name,
        amounts: { [from.id]: from.kind === "credit" ? v : -v, [to.id]: to.kind === "credit" ? -v : v } };
      c.route = `${from.name} → ${to.name}`;
      // 相手の口座のCSVで取り込み済み、または手入力済みの振替
      const dup = state.transactions.find(t => t.type === "transfer" && !used.has(t.id) && txOf(t, from.id, to.id, v) && dayDiff(t.date, r.date) <= 3);
      if (dup) {
        used.add(dup.id);
        if (dup.importId) { c.skip = "pair"; return c; }
        c.check = false; c.note = `手入力済みかも: ${dup.date.slice(5).replace("-", "/")} ${dup.name}`;
      }
      return c;
    }
    const type = r.flow < 0 ? "expense" : "income";
    const amt = type === "expense" ? (payer.kind === "credit" ? v : -v) : (payer.kind === "credit" ? -v : v);
    c.tx = { type, categoryId: guessCsvCategory(r.name, type), name: r.name, amounts: { [payer.id]: amt } };
    if (isCharge) {
      // チャージ元が分からないまま収入にすると収入が水増しされるので、確認してもらう
      c.check = false; c.note = "チャージ元の口座が分かりません(振替として手入力をおすすめ)";
      return c;
    }
    const dup = state.transactions.find(t => !t.importId && !used.has(t.id) && t.type === type && t.amounts[payer.id] === amt && dayDiff(t.date, r.date) <= 2);
    if (dup) {
      used.add(dup.id);
      c.check = false; c.note = `手入力済みかも: ${dup.date.slice(5).replace("-", "/")} ${dup.name}`;
    }
    return c;
  });
}

/* 列を自動で判定できなかったとき、ユーザーに選んでもらう */
function csvMappingDialog(rows, a) {
  const width = Math.max(...rows.slice(0, 30).map(r => r.length));
  const sample = rows.find(r => r.some(c => csvDate(c))) || rows[0];
  const gDate = sample.findIndex(c => csvDate(c));
  const gAmt = sample.findIndex((c, i) => i !== gDate && csvAmount(c) !== null);
  const gName = sample.findIndex((c, i) => i !== gDate && i !== gAmt && nk(c) && csvAmount(c) === null);
  const opts = (sel, none) => (none ? `<option value="-1" ${sel < 0 ? "selected" : ""}>(なし)</option>` : "")
    + Array.from({ length: width }, (_, i) =>
      `<option value="${i}" ${sel === i ? "selected" : ""}>${i + 1}列目: ${esc(nk(sample[i] || "").slice(0, 14))}</option>`).join("");
  return dialog({
    html: `<p class="md-title">列を選んでください</p>
      <p style="font-size:12px">「${esc(a.name)}」のCSVの形式を自動で判定できませんでした。どの列が何かを選んでください。</p>
      <label>日付</label><select id="mp-date">${opts(gDate, false)}</select>
      <label>内容(店名・摘要)</label><select id="mp-name">${opts(gName, true)}</select>
      <label>金額(出金・支払い)</label><select id="mp-out">${opts(gAmt, false)}</select>
      <label>入金の列(出金と別の列の場合)</label><select id="mp-in">${opts(-1, true)}</select>
      <label>金額が1列のとき、プラスの金額は</label>
      <select id="mp-sign"><option value="spend" ${a.kind === "credit" ? "selected" : ""}>支出(使ったお金)</option>
        <option value="flow" ${a.kind !== "credit" ? "selected" : ""}>入金(マイナスが出金)</option></select>
      <div class="btns"><button class="cancel" data-md="c">キャンセル</button><button class="ok" data-md="ok">次へ</button></div>`,
    cancelValue: null, autofocus: false,
    onAction: (act, done, ov) => {
      if (act !== "ok") { done(null); return; }
      const g = id => Number(ov.querySelector(id).value);
      const inCol = g("#mp-in");
      done({ headerRow: -1, date: g("#mp-date"), store: g("#mp-name"), desc: [], method: -1,
        out: inCol >= 0 ? g("#mp-out") : -1, in: inCol, amount: inCol >= 0 ? -1 : g("#mp-out"),
        spendPositive: ov.querySelector("#mp-sign").value === "spend" });
    }
  });
}

/* 取り込む前の確認一覧。返り値: 選ばれた候補の配列 / "remap"(列を選び直す) / null */
function csvPreviewDialog(a, cands) {
  const list = cands.filter(c => !c.skip).sort((x, y) => y.date.localeCompare(x.date));
  const cnt = k => cands.filter(c => c.skip === k).length;
  const skipped = [cnt("done") && `取り込み済み ${cnt("done")}件`, cnt("pair") && `相手口座で記録済みの振替 ${cnt("pair")}件`,
    cnt("other") && `残高以外での支払い ${cnt("other")}件`].filter(Boolean);
  const catOpts = c => state.categories.filter(x => x.type === c.tx.type).sort((x, y) => x.sortOrder - y.sortOrder)
    .map(x => `<option value="${x.id}" ${c.tx.categoryId === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("");
  const rowHtml = (c, i) => {
    const out = c.tx.type === "expense" || (c.tx.type === "transfer" && c.flow < 0);
    return `<div class="irow ${c.check ? "" : "off"}" id="ir-${i}">
      <input type="checkbox" data-i="${i}" ${c.check ? "checked" : ""}>
      <div class="ib">
        <div class="it"><span class="in">${esc(c.tx.name)}</span><span class="iv num ${out ? "" : "inc"}">${out ? "-" : "+"}${yen(c.flow)}</span></div>
        <div class="im"><span>${esc(c.date.slice(5).replace("-", "/"))}</span>
          ${c.tx.type === "transfer" ? `<span>🔁 ${esc(c.route)}</span>` : `<select data-ci="${i}">${catOpts(c)}</select>`}</div>
        ${c.note ? `<div class="inote">⚠ ${esc(c.note)}</div>` : ""}
      </div></div>`;
  };
  const okLabel = () => `取り込む(${list.filter(c => c.check).length}件)`;
  return dialog({
    html: `<p class="md-title">${esc(a.name)} の明細</p>
      <div class="isum">新しい記録 ${list.length}件${skipped.length ? "<br>除外: " + esc(skipped.join(" / ")) : ""}</div>
      ${list.length ? `<div class="ilist">${list.map(rowHtml).join("")}</div>
        <div class="irow-tools"><button class="btn-ghost" data-md="all">☑ 全部選ぶ / 外す</button>
          <button class="btn-ghost" data-md="remap">⇄ 列を選び直す</button></div>`
        : `<div class="empty">新しく取り込む記録はありません</div><button class="btn-ghost" data-md="remap">⇄ 列を選び直す</button>`}
      <div class="btns"><button class="cancel" data-md="c">キャンセル</button>
        ${list.length ? `<button class="ok" data-md="ok" id="ip-ok">${okLabel()}</button>` : ""}</div>`,
    cancelValue: null, autofocus: false,
    onOpen: ov => {
      ov.addEventListener("change", e => {
        const el = e.target;
        if (el.dataset.i !== undefined) {
          const c = list[Number(el.dataset.i)];
          c.check = el.checked;
          ov.querySelector("#ir-" + el.dataset.i).classList.toggle("off", !c.check);
          ov.querySelector("#ip-ok").textContent = okLabel();
        } else if (el.dataset.ci !== undefined) {
          list[Number(el.dataset.ci)].tx.categoryId = el.value;
        }
      });
    },
    onAction: (act, done, ov) => {
      if (act === "c") done(null);
      else if (act === "remap") done("remap");
      else if (act === "all") {
        const on = !list.every(c => c.check);
        list.forEach((c, i) => {
          c.check = on;
          ov.querySelector(`[data-i="${i}"]`).checked = on;
          ov.querySelector("#ir-" + i).classList.toggle("off", !on);
        });
        ov.querySelector("#ip-ok").textContent = okLabel();
      } else if (act === "ok") {
        const picked = list.filter(c => c.check);
        if (!picked.length) { toast("取り込む記録を選んでください"); return; }
        done(picked);
      }
    }
  });
}

/* ⬆ を押したとき: 取り方の案内を出してからファイルを選ばせる */
function csvStart(accId) {
  const a = acc(accId); if (!a) return;
  const f = CSV_FORMATS[a.importFormat || "auto"] || CSV_FORMATS.auto;
  return dialog({
    html: `<p class="md-title">${esc(a.name)} の明細を取り込む</p>
      <p style="font-size:12px;line-height:1.7">${esc(f.howto)}</p>
      <div class="hint">形式: ${esc(f.label)}(口座の ✎ で変更できます)</div>
      <div class="btns"><button class="cancel" data-md="c">キャンセル</button><button class="ok" data-md="ok">CSVを選ぶ</button></div>`,
    cancelValue: null, autofocus: false,
    onAction: (act, done) => {
      // iOS はタップの処理中でないとファイル選択を開けないので、ここで直接 click する
      if (act === "ok") { csvTargetId = accId; $("#csv-file").click(); }
      done(null);
    }
  });
}

async function runCsvImport(file, accId) {
  const a = acc(accId); if (!a) return;
  let rows;
  try { rows = parseCsv(await readCsvFile(file)); }
  catch (e) { console.error(e); alertDialog("CSVを読み込めませんでした: " + e.message); return; }
  if (!rows.length) { alertDialog("CSVに中身がありません"); return; }

  let m = detectCsvColumns(rows, a), manual = false;
  for (;;) {
    if (!m) { m = await csvMappingDialog(rows, a); manual = true; if (!m) return; }
    const recs = csvRecords(rows, m);
    if (!recs.length) {
      if (manual) { alertDialog("日付と金額を読み取れる行がありませんでした。\n選んだ列を確認してください。"); return; }
      m = null; continue;   // 自動判定が外れた → 列を選んでもらう
    }
    const r = await csvPreviewDialog(a, csvCandidates(recs, a));
    if (r === "remap") { m = null; continue; }
    if (r) csvCommit(r);
    return;
  }
}
function csvCommit(picked) {
  const offsetIds = state.categories.filter(c => c.offsetExpense).map(c => c.id);
  const ids = [];
  picked.forEach(c => {
    const t = { id: uid(), date: c.date, name: c.tx.name, type: c.tx.type, categoryId: c.tx.categoryId,
      amounts: c.tx.amounts, importId: c.importId };
    // 割り勘カテゴリを選んだ場合は v4 の割り勘と同じ形にそろえる(元記録なし)
    if (t.type === "income" && offsetIds.indexOf(t.categoryId) >= 0) { t.refTxId = null; t.offsetCategoryId = null; }
    state.transactions.push(t);
    ids.push(t.id);
  });
  persist();
  viewMonth = picked.reduce((m, c) => c.date > m ? c.date : m, "").slice(0, 7);
  render();
  toast(`${ids.length}件を取り込みました`, { ms: 6000, actionLabel: "取り消し", onAction: () => {
    const set = new Set(ids);
    state.transactions = state.transactions.filter(t => !set.has(t.id));
    persist(); render(); toast("取り込みを取り消しました");
  } });
}

/* ---------------- イベント ---------------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const act = el.dataset.action, id = el.dataset.id;
  switch (act) {
    case "nav": showScreen(el.dataset.scr); break;
    case "month-prev": shiftMonth(-1); break;
    case "month-next": shiftMonth(1); break;
    case "sav-month": viewMonth = el.dataset.ym; render(); break;
    case "toast-act": { const f = toast._act; hideToast(); if (f) f(); break; }
    /* --- クイック入力 --- */
    case "quick-charge":
      qMode = "charge"; qAmount = ""; qRef = null; inputMode = "quick"; editingId = null;
      if (currentScreen === "scr-input") renderQuick(); else showScreen("scr-input", true);
      break;
    case "quick-warikan": {
      // 先に元記録を選ばせる。キャンセルなら画面を動かさない
      const r = await warikanRefDialog();
      if (r === null) break;
      qMode = "warikan"; qRef = r.ref; qAmount = "";
      qAccountId = qAccountId || defaultQuickAccount(null);
      inputMode = "quick"; editingId = null;
      if (currentScreen === "scr-input") renderQuick(); else showScreen("scr-input", true);
      break;
    }
    case "w-all": qAmount = String(el.dataset.amt); renderQuick(); break;
    case "q-item": {
      const it = quickItemsList()[Number(el.dataset.idx)];
      if (!it) break;
      const tx = quickTxFromItem(it);
      if (!tx) { openPrefilledDetail(quickPrefillFromItem(it)); break; }
      state.transactions.push(tx);
      persist();
      viewMonth = tx.date.slice(0, 7);
      render();   // 今いる画面を再描画(ホームに留まる)
      // 名前が長いとトーストが何行にもなるので詰める
      const label = it.name.length > 12 ? it.name.slice(0, 12) + "…" : it.name;
      toast(`${label} ${yen(Math.abs(Object.values(tx.amounts)[0]))}を記録`,
        { ms: 5000, actionLabel: "取り消し", onAction: () => undoTx(tx.id) });
      break;
    }
    case "q-acc": qAccountId = id; renderQuick(); break;
    case "q-key": {
      const k = el.dataset.k;
      if (qAmount.length < 8) qAmount = (qAmount + k).replace(/^0+(?=\d)/, "");
      renderQuick();
      break;
    }
    case "q-del": qAmount = qAmount.slice(0, -1); renderQuick(); break;
    case "q-save": await quickSave(); break;
    case "to-detail":
      inputMode = "detail";
      inputType = qMode === "charge" ? "transfer" : "income";
      if (qMode === "warikan") selectedCatId = warikanCatId();
      renderInput();
      break;
    /* --- 詳細フォーム --- */
    case "set-type": {
      // 種別を切り替えても、入力済みの日付・名前・金額は保持する
      // (レシート読み取りの直後に誤って収入を押しても金額が消えないように)
      const keep = {
        date: $("#in-date") && $("#in-date").value,
        name: $("#in-name") && $("#in-name").value,
        amts: {}
      };
      state.accounts.forEach(a => {
        const i = $("#amt-" + a.id);
        if (i && i.value) keep.amts[a.id] = i.value;
      });
      inputType = el.dataset.type;
      renderInput();
      if (keep.date && $("#in-date")) $("#in-date").value = keep.date;
      if (keep.name && $("#in-name")) $("#in-name").value = keep.name;
      Object.keys(keep.amts).forEach(k => { const i = $("#amt-" + k); if (i) i.value = keep.amts[k]; });
      break;
    }
    case "toggle-qreg": saveAsQuick = !saveAsQuick; renderInput(); break;
    case "quick-from-tx": {
      const t = state.transactions.find(x => x.id === id);
      if (!t) break;
      const ids = Object.keys(t.amounts);
      const v = await quickItemDialog({
        name: t.name,
        categoryId: t.categoryId || null,
        accountId: ids.length === 1 ? ids[0] : null,
        amount: Math.round(txAmount(t)) || null
      });
      if (!v) break;
      if (!isCustomQuick()) state.settings.quickItems = autoQuickItems(QUICK_MAX);
      const arr = state.settings.quickItems;
      const i = arr.findIndex(x => x.name === v.name);
      if (i >= 0) arr[i] = v; else arr.unshift(v);
      if (arr.length > 8) arr.length = 8;
      persist(); render(); toast("クイックに登録しました");
      break;
    }
    case "set-cat":
      selectedCatId = id;
      document.querySelectorAll('[data-action="set-cat"]').forEach(c => c.classList.toggle("sel", c.dataset.id === id));
      break;
    case "save-tx": saveTx(); break;
    case "delete-tx": deleteTx(); break;
    case "edit-tx": openEdit(id); break;
    /* --- 設定 --- */
    case "quick-customize":
      // いま自動で出ているチップをそのまま引き継ぐ(切り替えた瞬間に空になると驚く)
      state.settings.quickItems = autoQuickItems(QUICK_MAX);
      persist(); renderSettings(); toast("カスタムに切り替えました");
      break;
    case "quick-auto":
      if (await confirmDialog("チップを自動(よく使う順)に戻しますか?\nカスタム設定は消えます。")) {
        state.settings.quickItems = null; persist(); renderSettings(); toast("自動に戻しました");
      }
      break;
    case "quick-add": {
      const v = await quickItemDialog(null);
      if (v) {
        if (!Array.isArray(state.settings.quickItems)) state.settings.quickItems = [];
        state.settings.quickItems.push(v);
        persist(); renderSettings(); toast("追加しました");
      }
      break;
    }
    case "quick-edit": {
      const i = Number(el.dataset.idx);
      const v = await quickItemDialog(state.settings.quickItems[i]);
      if (v) { state.settings.quickItems[i] = v; persist(); renderSettings(); toast("保存しました"); }
      break;
    }
    case "quick-del": {
      state.settings.quickItems.splice(Number(el.dataset.idx), 1);
      persist(); renderSettings(); toast("削除しました");
      break;
    }
    case "quick-up": {
      const i = Number(el.dataset.idx), arr = state.settings.quickItems;
      if (i > 0) { [arr[i-1], arr[i]] = [arr[i], arr[i-1]]; persist(); renderSettings(); }
      break;
    }
    case "quick-down": {
      const i = Number(el.dataset.idx), arr = state.settings.quickItems;
      if (i < arr.length - 1) { [arr[i+1], arr[i]] = [arr[i], arr[i+1]]; persist(); renderSettings(); }
      break;
    }
    case "budget-month": budgetMonth(); break;
    case "budget-cat": budgetCat(id); break;
    case "cat-rename": catRename(id); break;
    case "cat-del": catDel(id); break;
    case "cat-add": catAdd(); break;
    case "acc-edit": accEdit(id); break;
    case "acc-arch": accArchive(id); break;
    case "acc-del": accDel(id); break;
    case "acc-add": accAdd(); break;
    /* --- レシート --- */
    case "receipt-shot": $("#receipt-file").click(); break;
    case "apikey-set": {
      const v = await promptDialog("Claude の APIキーを貼り付け", "", { type: "password" });
      if (v === null) break;
      const k = v.trim();
      if (k && !/^sk-ant-/.test(k) &&
          !await confirmDialog("Anthropic のキーは通常 sk-ant- で始まります。\nこのまま保存しますか?", { okText: "保存" })) break;
      setApiKey(k);
      renderSettings();
      toast(k ? "APIキーを保存しました" : "APIキーを削除しました");
      break;
    }
    case "apikey-del":
      if (await confirmDialog("保存したAPIキーを削除しますか?", { danger: true, okText: "削除" })) {
        setApiKey(""); renderSettings(); toast("削除しました");
      }
      break;
    case "receipt-res":
      state.settings.receiptRes = state.settings.receiptRes === "std" ? "high" : "std";
      persist(); renderSettings();
      break;
    case "csv-import": csvStart(id); break;
    case "export": exportData(); break;
    case "import": $("#import-file").click(); break;
    case "reset": resetData(); break;
  }
});
$("#import-file").addEventListener("change", e => {
  if (e.target.files.length) importData(e.target.files[0]);
  e.target.value = "";
});
$("#csv-file").addEventListener("change", e => {
  if (e.target.files.length && csvTargetId) runCsvImport(e.target.files[0], csvTargetId);
  e.target.value = "";
});
$("#receipt-file").addEventListener("change", e => {
  if (e.target.files.length) runReceipt(e.target.files[0]);
  e.target.value = "";   // 同じ写真を続けて選んでも change が発火するように
});

/* ---------------- 起動 ---------------- */
showScreen("scr-home");

// PWA: Service Worker登録(https配信時と、動作確認用の localhost のみ)
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("./sw.js").catch(e => console.warn("SW登録失敗:", e));
  // SW はキャッシュ済みの版を先に表示し、裏で最新版を取ってくる。新しい版が届いたら知らせる
  navigator.serviceWorker.addEventListener("message", e => {
    if (e.data && e.data.type === "app-updated")
      toast("新しいバージョンがあります", { ms: 15000, actionLabel: "更新", onAction: () => location.reload() });
  });
}
</script>
</body>
</html>
